<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tulip-rs · Live Indicator Demo</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #131722;
                --surface: #1e2235;
                --border: #2a2e3e;
                --text: #d1d4dc;
                --muted: #787b86;
                --green: #26a69a;
                --red: #ef5350;
                --blue: #2196f3;
                --radius: 6px;
                --font: "Inter", system-ui, sans-serif;
            }

            html,
            body {
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font-family: var(--font);
                font-size: 13px;
                overflow: hidden;
            }

            #app {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            /* ── Header ── */
            #header {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                height: 44px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
            }
            #ticker-info {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 600;
                letter-spacing: 0.3px;
            }
            #ticker-info .ticker {
                font-size: 15px;
            }
            #ticker-info .meta {
                color: var(--muted);
                font-weight: 400;
                font-size: 12px;
            }
            #zoom-btns {
                display: flex;
                gap: 4px;
            }
            #zoom-btns button {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--muted);
                padding: 3px 10px;
                border-radius: var(--radius);
                cursor: pointer;
                font-size: 12px;
                transition: all 0.15s;
            }
            #zoom-btns button:hover {
                border-color: var(--blue);
                color: var(--text);
            }
            #zoom-btns button.active {
                background: var(--blue);
                border-color: var(--blue);
                color: #fff;
            }

            /* ── Chart ── */
            #chart-wrap {
                flex: 1;
                min-height: 0;
                position: relative;
            }
            #chart {
                width: 100%;
                height: 100%;
            }

            /* ── Loading overlay ── */
            #loading {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: rgba(19, 23, 34, 0.92);
                gap: 14px;
                z-index: 100;
            }
            .spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--border);
                border-top-color: var(--blue);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            #loading p {
                color: var(--muted);
                font-size: 12px;
            }

            /* ── Controls ── */
            #controls {
                flex-shrink: 0;
                background: var(--surface);
                border-top: 1px solid var(--border);
                padding: 8px 16px;
            }
            #controls-row {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #open-dialog-btn {
                background: var(--blue);
                color: #fff;
                border: none;
                border-radius: var(--radius);
                padding: 6px 14px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                white-space: nowrap;
                transition: opacity 0.15s;
                flex-shrink: 0;
            }
            #open-dialog-btn:hover {
                opacity: 0.88;
            }

            /* ── Active badges ── */
            #active-row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                min-height: 0;
                margin-top: 6px;
            }
            #active-row:empty {
                display: none;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 3px 8px 3px 6px;
                font-size: 11px;
            }
            .badge .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--c, var(--blue));
                flex-shrink: 0;
            }
            .badge .x {
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                padding: 0 0 0 3px;
                font-size: 11px;
                line-height: 1;
                transition: color 0.15s;
            }
            .badge .x:hover {
                color: var(--red);
            }

            /* ═══════════════════════════════════════════════════════════
       Dialog
    ═══════════════════════════════════════════════════════════ */
            dialog {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0;
                width: 460px;
                max-width: 96vw;
                max-height: 85vh;
                color: var(--text);
                box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            dialog::backdrop {
                background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(3px);
            }

            .dlg-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 16px 12px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }
            .dlg-head h2 {
                font-size: 13px;
                font-weight: 600;
            }
            .dlg-head .dlg-x {
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                font-size: 15px;
                line-height: 1;
                padding: 2px 4px;
                border-radius: 4px;
                transition: color 0.15s;
            }
            .dlg-head .dlg-x:hover {
                color: var(--text);
            }

            .dlg-body {
                padding: 14px 16px;
                overflow-y: auto;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            /* Indicator selector */
            .dlg-ind-wrap {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            .dlg-ind-wrap label {
                font-size: 11px;
                color: var(--muted);
                font-weight: 500;
            }
            .dlg-ind-wrap select {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 7px 8px;
                font-size: 12px;
                width: 100%;
                cursor: pointer;
            }
            .dlg-ind-wrap select:focus {
                outline: none;
                border-color: var(--blue);
            }
            .dlg-ind-wrap select optgroup {
                color: var(--muted);
                font-style: normal;
            }
            .dlg-ind-wrap select option {
                color: var(--text);
                background: var(--bg);
            }

            /* Section headings */
            .dlg-section {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .dlg-section-title {
                font-size: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--muted);
            }

            /* Options grid */
            .options-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px;
            }
            .opt-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .opt-field label {
                font-size: 11px;
                color: var(--muted);
            }
            .opt-field input[type="number"],
            .opt-field select {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 5px 7px;
                font-size: 12px;
                width: 100%;
            }
            .opt-field input[type="number"]:focus,
            .opt-field select:focus {
                outline: none;
                border-color: var(--blue);
            }

            /* Output rows (primary outputs) */
            .out-list {
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .out-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 6px 0;
                border-bottom: 1px solid rgba(42, 46, 62, 0.5);
            }
            .out-row:last-child {
                border-bottom: none;
            }
            .out-name {
                flex: 1;
                font-size: 12px;
                color: var(--text);
                font-family: monospace;
            }

            /* Optional output group headers */
            .opt-group-header {
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--muted);
                padding: 10px 0 3px;
                border-bottom: 1px solid rgba(42, 46, 62, 0.7);
                margin-top: 4px;
            }
            .opt-group-header.first {
                padding-top: 0;
                margin-top: 0;
            }

            /* Optional output rows */
            .opt-out-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 6px 0;
                border-bottom: 1px solid rgba(42, 46, 62, 0.5);
            }
            .opt-out-row:last-child {
                border-bottom: none;
            }
            .opt-check-label {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 7px;
                cursor: pointer;
                font-size: 12px;
                color: var(--muted);
                font-family: monospace;
                user-select: none;
            }
            .opt-check-label input[type="checkbox"] {
                accent-color: var(--blue);
                cursor: pointer;
                flex-shrink: 0;
            }
            .opt-check-label.is-checked {
                color: var(--text);
            }

            /* Color swatches */
            .color-swatch {
                width: 26px;
                height: 26px;
                border-radius: 5px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                cursor: pointer;
                padding: 0;
                flex-shrink: 0;
                transition: border-color 0.15s;
            }
            .color-swatch:hover {
                border-color: rgba(255, 255, 255, 0.45);
            }
            .color-swatch::-webkit-color-swatch-wrapper {
                padding: 0;
            }
            .color-swatch::-webkit-color-swatch {
                border: none;
                border-radius: 4px;
            }

            /* Checkbox row (fill-band) */
            .check-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 0;
                cursor: pointer;
                font-size: 12px;
                color: var(--text);
            }
            .check-row input {
                accent-color: var(--blue);
                cursor: pointer;
            }

            /* Dialog footer */
            .dlg-foot {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                padding: 12px 16px;
                border-top: 1px solid var(--border);
                flex-shrink: 0;
            }
            .btn-cancel {
                background: transparent;
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 16px;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.15s;
            }
            .btn-cancel:hover {
                color: var(--text);
                border-color: var(--text);
            }
            .btn-primary {
                background: var(--blue);
                color: #fff;
                border: none;
                border-radius: var(--radius);
                padding: 6px 20px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: opacity 0.15s;
            }
            .btn-primary:hover {
                opacity: 0.88;
            }

    <body>
        <div id="app">
            <!-- Header -->
            <div id="header">
                <div id="ticker-info">
                    <span class="ticker">MSFT</span>
                    <span class="meta">Daily · NYSE · tulip-rs-wasm</span>
                </div>
                <div id="zoom-btns">
                    <button data-zoom="1">1Y</button>
                    <button data-zoom="2" class="active">2Y</button>
                    <button data-zoom="5">5Y</button>
                    <button data-zoom="all">All</button>
                </div>
            </div>

            <!-- Chart -->
            <div id="chart-wrap">
                <div id="chart"></div>
                <div id="loading">
                    <div class="spinner"></div>
                    <p>Loading WASM indicators…</p>
                </div>
            </div>

            <!-- Controls -->
            <div id="controls">
                <div id="controls-row">
                    <button id="open-dialog-btn">＋ Add Indicator</button>
                </div>
                <div id="active-row"></div>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════
       Add-Indicator Dialog
  ═══════════════════════════════════════════════════════════ -->
        <dialog id="ind-dialog">
            <!-- Header -->
            <div class="dlg-head">
                <h2>Add Indicator</h2>
                <button class="dlg-x" id="dlg-x" title="Close">✕</button>
            </div>

            <!-- Body -->
            <div class="dlg-body">
                <!-- Indicator selector -->
                <div class="dlg-ind-wrap">
                    <label for="dlg-ind">Indicator</label>
                    <select id="dlg-ind"></select>
                </div>

                <!-- Options (numeric params) -->
                <div class="dlg-section" id="dlg-options-sec">
                    <div class="dlg-section-title">Options</div>
                    <div class="options-grid" id="dlg-options"></div>
                </div>

                <!-- Primary outputs with colour pickers -->
                <div class="dlg-section" id="dlg-outputs-sec">
                    <div class="dlg-section-title">Outputs</div>
                    <div class="out-list" id="dlg-outputs"></div>
                </div>

                <!-- Optional outputs with checkboxes + colour pickers -->
                <div class="dlg-section" id="dlg-opt-sec">
                    <div class="dlg-section-title">Optional Outputs</div>
                    <div class="out-list" id="dlg-opt-outputs"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="dlg-foot">
                <button class="btn-cancel" id="dlg-cancel">Cancel</button>
                <button class="btn-primary" id="dlg-add">Add</button>
            </div>
        </dialog>

    </body>
</html>
